<script>
/* ===== ONLINE SETTINGS =====
   Paste your Firebase Realtime Database URL between the quotes (no trailing slash).
   Example: "https://my-project-default-rtdb.asia-southeast1.firebasedatabase.app"
   Leave empty = offline mode (data saved on this device only). */
const FB="";
const FPATH="polish-fsa-dch";   /* change to a long random word for more privacy */
const STEPS=[{n:"Cleaning",off:2},{n:"Concrete surface grinding",off:1},{n:"Liquid Hardener application",off:0}];
const ZONES=[{n:"FSA",x0:4,x1:16,c:"#ebc9d3"},{n:"DCH 1",x0:16,x1:38.8,c:"#d7cce6"},{n:"DCH 2",x0:38.8,x1:59,c:"#f4d9c9"},{n:"DCH 3",x0:59,x1:78.8,c:"#cfe0e3"},{n:"DCH 4",x0:78.8,x1:98.5,c:"#e3d0e0"}];
const ROWS=[15.6,36.5,57.3,77.7,97.5];
const START=new Date(2026,10,17);
const XL=[4,16,23.6,31.2,38.8],XR=[38.8,48.75,58.7,68.65,78.6,88.55,98.5];
const RU=[15.6,36.1,56.6,77,97.5],RA=[15.6,46.1,64.6,82.1,97.5];
const LEFT=[[5,16,9,11],[1,8,4,7],[2,13,6,10],[3,15,12,14]],RIGHT=[[18,20,17,19],[22,24,21,23],[26,28,25,27],[30,32,29,31],[34,36,33,35],[37,40,38,39]];
const zn=x=>x<16?"FSA":x<38.8?"DCH 1":x<59?"DCH 2":x<78.8?"DCH 3":"DCH 4";
const P=[];
const blk=(cols,X,rowsOf,isR)=>cols.forEach((col,c)=>col.forEach((n,r)=>{const R=rowsOf(c);P.push({id:n,z:{n:zn(X[c]),c:(c+r)%2?"#d4c8e8":"#ebc3d0"},l:X[c]+.2,t:R[r]+.3,w:X[c+1]-X[c]-.4,h:R[r+1]-R[r]-.6,rd:false})}));
blk(LEFT,XL,c=>c?RU:RA,false);blk(RIGHT,XR,c=>RU,true);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pd=s=>{const a=s.split("-");return new Date(+a[0],a[1]-1,+a[2])};
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>pd(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const KEY="polish-fsa-dch-v2";
let S={dates:{},done:{}};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const ensureDates=()=>P.forEach(p=>{if(!S.dates[p.id])S.dates[p.id]=iso(new Date(START.getTime()+(2+3*Math.floor((p.id-1)/4))*864e5+3600e3))});ensureDates();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let dirty=false;
const setSync=(t,c)=>{const e=document.getElementById("sync");if(e){e.textContent=t;e.style.color=c}};
const okS=()=>setSync("\u25cf Online \u00b7 synced","#9be3b0"),errS=()=>{dirty=true;setSync("\u25cf Sync error \u2013 saved on this device","#ffd27a")};
async function push(path,val){if(!FB)return;try{const r=await fetch(`${FB}/${FPATH}/${path}.json`,val==null?{method:"DELETE"}:{method:"PUT",body:JSON.stringify(val)});if(!r.ok)throw 0;okS()}catch(e){errS()}}
const norm=o=>{const r={};Object.keys(o||{}).forEach(k=>{if(o[k]!=null)r[k]=o[k]});return r};
async function pull(){if(!FB||document.getElementById("bk").classList.contains("on"))return;
 try{if(dirty){const r0=await fetch(`${FB}/${FPATH}.json`,{method:"PUT",body:JSON.stringify({dates:S.dates,done:S.done,area:S.area||{}})});if(!r0.ok)throw 0;dirty=false}
 const r=await fetch(`${FB}/${FPATH}.json`);if(!r.ok)throw 0;const j=await r.json()||{};
 S.dates=norm(j.dates);S.area=norm(j.area);const jd=norm(j.done),dn={};Object.keys(jd).forEach(k=>{const v=norm(jd[k]);if(Object.keys(v).length)dn[k]=v});S.done=dn;
 ensureDates();save();render();okS()}catch(e){errS()}}
const refEl=document.getElementById("ref");refEl.value=iso(new Date());
function status(p){const m=S.dates[p.id],d=S.done[p.id]||{},R=refEl.value;const k=STEPS.filter((s,i)=>d[i]).length;
 const late=STEPS.some((s,i)=>d[i]?d[i]>add(m,-s.off):add(m,-s.off)<R);
 if(k<3&&R>m)return"red";
 if(late)return"yellow";
 return k>0?"green":"base"}
const COL={red:"#e4788a",yellow:"#fbeaa0",green:"#c5e8cf"};
const plan=document.getElementById("plan");

const els={};P.forEach(p=>{const e=document.createElement("div");e.className="p"+(p.rd?" rd":"");e.style.cssText=`left:${p.l}%;top:${p.t}%;width:${p.w}%;height:${p.h}%`;e.onclick=()=>openM(p);plan.appendChild(e);els[p.id]=e});
function render(){const cnt={done:0,red:0,yellow:0,green:0,base:0};
 P.forEach(p=>{const s=status(p),e=els[p.id];cnt[s]++;if(pdone(p))cnt.done++;
  e.style.background=s=="base"?`repeating-linear-gradient(45deg,#fff 0 .5cqw,${p.z.c} .5cqw 1cqw)`:COL[s];
  e.style.background=s=="base"?p.z.c:COL[s];
  const k=STEPS.filter((x,i)=>(S.done[p.id]||{})[i]).length;
  e.style.borderColor=s=="red"?"#b4233f":"";e.style.borderWidth=s=="red"?"3px":"";
  e.innerHTML=`<span class="a">${(S.area||{})[p.id]?S.area[p.id]+" m²":""}</span><span class="c">${k}/3</span><span class="n">${p.id}</span><span class="d">${fmt(S.dates[p.id])}</span>`});
 document.getElementById("stat").innerHTML=`Completed <b>${cnt.done}</b> / 40 panels (${Math.round(cnt.done/.4)}%)<br>Overdue: ${cnt.red} hardener · ${cnt.yellow} delayed`}
function openM(p){const m=S.dates[p.id],d=S.done[p.id]||(S.done[p.id]={}),R=refEl.value;
 let h=`<h2>Panel ${p.id} · ${p.z.n}</h2><div class="sub">Final step (Liquid Hardener) date: <input type="date" id="md" value="${m}"></div><div class="sub" style="margin-top:6px">Area (m²): <input type="number" id="ar" value="${(S.area||{})[p.id]||""}" style="width:90px;padding:5px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)"></div>`;
 STEPS.forEach((s,i)=>{const due=add(m,-s.off),late=!d[i]&&due<R,ok=d[i]&&d[i]<=due;
  h+=`<label class="row ${late||(d[i]&&!ok)?"late":ok?"ok":""}"><input type="checkbox" data-i="${i}" ${d[i]?"checked":""}><span>${i+1}. ${s.n}<small>Due ${fmt(due)}${d[i]?" · done "+fmt(d[i]):""}</small></span><span class="tag">${late?"OVERDUE":d[i]?(ok?"ON PLAN":"LATE DONE"):""}</span></label>`});
 h+=`<div style="text-align:right;margin-top:12px"><button id="x">Close</button></div>`;
 const md=document.getElementById("md");md.innerHTML=h;bk.classList.add("on");
 md.querySelector("#md").onchange=e=>{if(e.target.value){S.dates[p.id]=e.target.value;push("dates/"+p.id,e.target.value);save();render();openM(p)}};
 md.querySelectorAll("[data-i]").forEach(c=>c.onchange=()=>{const i=c.dataset.i;if(c.checked)d[i]=R;else delete d[i];push(`done/${p.id}/${i}`,c.checked?R:null);save();render();openM(p)});
 md.querySelector("#ar").onchange=e=>{S.area=S.area||{};S.area[p.id]=e.target.value;push("area/"+p.id,e.target.value||null);save();render()};md.querySelector("#x").onclick=()=>bk.classList.remove("on")}
const bk=document.getElementById("bk");bk.onclick=e=>{if(e.target==bk)bk.classList.remove("on")};
refEl.onchange=render;document.getElementById("today").onclick=()=>{refEl.value=iso(new Date());render()};
document.getElementById("reset").onclick=async()=>{if(confirm(FB?"Clear ALL ticks and edited dates for EVERYONE (online)?":"Clear all ticks and edited dates?")){try{localStorage.removeItem(KEY)}catch(e){}if(FB){try{await fetch(`${FB}/${FPATH}.json`,{method:"DELETE"})}catch(e){}}location.reload()}};
const $=i=>document.getElementById(i);let mode="D";
const fmtL=s=>pd(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const stepsOf=p=>{const m=S.dates[p.id],d=S.done[p.id]||{};return STEPS.map((s,i)=>({p:p.id,n:s.n,due:add(m,-s.off),done:d[i]||null}))};
const pdone=p=>{const d=S.done[p.id]||{};return STEPS.every((s,i)=>d[i])?Object.values(d).sort().pop():null};
const kp=a=>`<div class="kp">${a.map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>`;
const stl=(x,D)=>x.done?(x.done<=x.due?'<span class="st-ok">Done · on plan</span>':'<span class="st-late">Done · late</span>'):x.due<D?'<span class="st-late">Overdue</span>':x.due==D?"Due today":"Upcoming";
function daily(D){const A=P.flatMap(stepsOf);const rows=A.filter(x=>x.due==D||x.done==D||(!x.done&&x.due<D)).sort((a,b)=>a.p-b.p||a.due.localeCompare(b.due));
 return `<h3>Daily report · ${fmtL(D)}</h3>`+kp([["Steps due today",A.filter(x=>x.due==D).length],["Steps completed today",A.filter(x=>x.done==D).length],["Open overdue steps",A.filter(x=>!x.done&&x.due<D).length],["Panels finished / planned",P.filter(p=>pdone(p)==D).length+" / "+P.filter(p=>S.dates[p.id]==D).length]])+`<table class="rt"><tr><th>Panel</th><th>Step</th><th>Planned</th><th>Actual</th><th>Status</th></tr>${rows.map(x=>`<tr><td>${x.p}</td><td>${x.n}</td><td>${fmt(x.due)}</td><td>${x.done?fmt(x.done):"–"}</td><td>${stl(x,D)}</td></tr>`).join("")||'<tr><td colspan="5">No activity</td></tr>'}</table>`}
function weekly(D){const ws=add(D,-((pd(D).getDay()+1)%7)),we=add(ws,6),A=P.flatMap(stepsOf);
 const cp=e=>P.filter(p=>S.dates[p.id]<=e).length,ca=e=>P.filter(p=>{const x=pdone(p);return x&&x<=e}).length,pv=add(ws,-1);
 let h=`<h3>Weekly report · ${fmt(ws)} – ${fmt(we)} (Sat–Fri)</h3>`+kp([["Panels planned this week",cp(we)-cp(pv)],["Panels finished this week",ca(we)-ca(pv)],["Cumulative planned",cp(we)+" / 40"],["Cumulative actual",ca(we)+" / 40 ("+Math.round(ca(we)*2.5)+"%)"]]);
 h+='<table class="rt"><tr><th>Date</th><th>Panels planned</th><th>Panels finished</th><th>Steps due</th><th>Steps done</th></tr>';
 for(let i=0;i<7;i++){const d=add(ws,i);h+=`<tr><td>${fmtL(d)}</td><td>${P.filter(p=>S.dates[p.id]==d).length}</td><td>${P.filter(p=>pdone(p)==d).length}</td><td>${A.filter(x=>x.due==d).length}</td><td>${A.filter(x=>x.done==d).length}</td></tr>`}
 h+='</table><h3>Project overview by week</h3>';
 const ds=Object.values(S.dates).sort(),last=ds[ds.length-1];let w=add(ds[0],-2);w=add(w,-((pd(w).getDay()+1)%7));const W=[];
 for(;w<=last;w=add(w,7)){const e=add(w,6),b=add(w,-1);W.push({w,e,pl:cp(e),ac:ca(e),dp:cp(e)-cp(b),da:ca(e)-ca(b)})}
 const n=W.length,X=i=>40+i*(640/Math.max(n-1,1)),Y=v=>190-v*4;
 const pl=W.map((q,i)=>X(i)+","+Y(q.pl)).join(" "),ac=W.map((q,i)=>q.w<=D?X(i)+","+Y(q.ac):"").filter(Boolean).join(" ");
 h+=`<svg viewBox="0 0 700 220" style="width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px">${[0,20,40].map(v=>`<line x1="40" x2="680" y1="${Y(v)}" y2="${Y(v)}" stroke="#d9ccd4"/><text x="34" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="currentColor">${v}</text>`).join("")}<polyline points="${pl}" fill="none" stroke="#a8577e" stroke-width="2.5"/><polyline points="${ac}" fill="none" stroke="#2f7a4d" stroke-width="2.5"/>${W.map((q,i)=>`<text x="${X(i)}" y="208" font-size="10" text-anchor="middle" fill="currentColor">W${i+1}</text>`).join("")}<text x="50" y="14" font-size="11" fill="#a8577e">— Plan (cumulative panels)</text><text x="230" y="14" font-size="11" fill="#2f7a4d">— Actual</text></svg>`;
 h+='<table class="rt"><tr><th>Week</th><th>Period</th><th>Planned</th><th>Finished</th><th>Cum. plan</th><th>Cum. actual</th><th>Progress</th></tr>'+W.map((q,i)=>`<tr class="${q.w==ws?"cur":""}"><td>W${i+1}</td><td>${fmt(q.w)} – ${fmt(q.e)}</td><td>${q.dp}</td><td>${q.w<=D?q.da:"–"}</td><td>${q.pl}</td><td>${q.w<=D?q.ac:"–"}</td><td>${q.w<=D?Math.round(q.ac*2.5)+"%":"–"}</td></tr>`).join("")+'</table>';
 return h}
function sdata(){const A=P.flatMap(stepsOf),N=A.length,all=A.map(x=>x.due).concat(A.filter(x=>x.done).map(x=>x.done)).sort(),days=[];
 for(let d=all[0];d<=all[all.length-1];d=add(d,1))days.push(d);
 return{A,N,days,plan:days.map(d=>A.filter(x=>x.due<=d).length/N*100),act:days.map(d=>A.filter(x=>x.done&&x.done<=d).length/N*100)}}
function scurve(D){const s=sdata(),n=s.days.length,pl=s.A.filter(x=>x.due<=D).length/s.N*100,ac=s.A.filter(x=>x.done&&x.done<=D).length/s.N*100,v=ac-pl;
 const X=i=>46+i*(700/Math.max(n-1,1)),Y=u=>270-u*2.5,di=s.days.indexOf(D);
 const L=(a,f)=>a.map((u,i)=>f(i)?X(i)+","+Y(u):"").filter(Boolean).join(" ");
 let h=`<h3>S-Curve \u00b7 cumulative progress (all steps equally weighted) \u00b7 as of ${fmt(D)}</h3>`+kp([["Plan to date",pl.toFixed(1)+"%"],["Actual to date",ac.toFixed(1)+"%"],["Variance",(v>=0?"+":"")+v.toFixed(1)+" pts"],["Status",Math.abs(v)<.05?"On plan":v>0?"Ahead":"Behind"]]);
 h+=`<svg viewBox="0 0 780 320" style="width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px">${[0,25,50,75,100].map(u=>`<line x1="46" x2="746" y1="${Y(u)}" y2="${Y(u)}" stroke="#d9ccd4"/><text x="40" y="${Y(u)+4}" font-size="11" text-anchor="end" fill="currentColor">${u}%</text>`).join("")}`
 +s.days.map((d,i)=>i%7==0?`<text x="${X(i)}" y="292" font-size="10" text-anchor="middle" fill="currentColor">${fmt(d)}</text>`:"").join("")
 +(di>=0?`<line x1="${X(di)}" x2="${X(di)}" y1="20" y2="270" stroke="#3b2a48" stroke-dasharray="5 4"/><text x="${X(di)+4}" y="30" font-size="10" fill="currentColor">Ref ${fmt(D)}</text>`:"")
 +`<polyline points="${L(s.plan,()=>1)}" fill="none" stroke="#a8577e" stroke-width="3"/><polyline points="${L(s.act,i=>s.days[i]<=D)}" fill="none" stroke="#2f7a4d" stroke-width="3"/><text x="56" y="14" font-size="12" font-weight="700" fill="#a8577e">\u2014 Plan</text><text x="120" y="14" font-size="12" font-weight="700" fill="#2f7a4d">\u2014 Actual</text></svg>`;
 h+='<table class="rt"><tr><th>Date</th><th>Plan %</th><th>Actual %</th><th>Variance</th></tr>'+s.days.map((d,i)=>(i%7==0||i==n-1)?`<tr class="${d==D?"cur":""}"><td>${fmtL(d)}</td><td>${s.plan[i].toFixed(1)}</td><td>${d<=D?s.act[i].toFixed(1):"\u2013"}</td><td>${d<=D?(s.act[i]-s.plan[i]).toFixed(1):"\u2013"}</td></tr>`:"").join("")+'</table>';
 return h}
function exportX(){const D=refEl.value,sd=sdata(),A=sd.A.slice().sort((a,b)=>a.p-b.p||a.due.localeCompare(b.due)),stx=x=>x.done?(x.done<=x.due?"Done - on plan":"Done - late"):x.due<D?"Overdue":"Upcoming";
 const SN={base:"Not yet due",green:"On plan / ahead",yellow:"Delayed",red:"Hardener overdue"};
 const pan=[["Panel","Zone","Area (m2)","Final step date","Status @ "+D,"Steps done"]].concat(P.slice().sort((a,b)=>a.id-b.id).map(p=>[p.id,p.z.n,(S.area||{})[p.id]||"",S.dates[p.id],SN[status(p)],STEPS.filter((s,i)=>(S.done[p.id]||{})[i]).length+"/3"]));
 const stp=[["Panel","Step","Planned date","Actual date","Status @ "+D]].concat(A.map(x=>[x.p,x.n,x.due,x.done||"",stx(x)]));
 const scr=[["Date","Plan cumulative %","Actual cumulative %"]].concat(sd.days.map((d,i)=>[d,+sd.plan[i].toFixed(1),d<=D?+sd.act[i].toFixed(1):""]));
 const name="Floor_Polishing_"+D;
 if(window.XLSX){const wb=XLSX.utils.book_new();[["Panels",pan],["Steps",stp],["S-Curve",scr]].forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n));XLSX.writeFile(wb,name+".xlsx")}
 else{alert("Excel library could not load (no internet). Downloading CSV of the Steps sheet instead.");const csv="\ufeff"+stp.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name+".csv";a.click()}}
